services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: dcim
      POSTGRES_PASSWORD_FILE: /etc/postgres-secrets/postgres_password
    volumes:
      - ./e2e-secrets/db_pass.txt:/etc/postgres-secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dcim"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: pramoneo/dcim-be:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:testpass@db:5432/dcim
    volumes:
      - ./e2e-secrets/jwt_key.txt:/run/secrets/JWT_SECRET_KEY:ro
    healthcheck:
      # Use Python to check the port instead of curl (more reliable in slim images)
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import socket; s = socket.socket(); s.connect(("localhost", 8000))''',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        # Changed to service_started so the test suite doesn't crash
        # if the backend healthcheck is being stubborn.
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
