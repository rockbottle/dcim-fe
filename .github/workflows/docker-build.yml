name: Build and Push DCIM Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. QUALITY & SECRET GATE: Catch errors in code history and style
  quality-gate:
    name: Lint, Unit Tests & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for deep secret scanning

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Format
        run: |
          # Allow up to 100 warnings (for 'any' types) but fail on errors
          npm run lint -- --max-warnings 100
          # Force remove any sarif files so Prettier doesn't complain about formatting them
          rm -f results.sarif
          npx prettier --check .

      - name: Run Unit Tests (Vitest)
        run: npx vitest run

  # 2. E2E VALIDATION: Spin up the Full Stack (Compose) and test logic
  e2e-validation:
    name: Full-Stack E2E Lifecycle
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare E2E Secrets
        run: |
          mkdir -p e2e-secrets
          echo "testpass" > e2e-secrets/db_pass.txt
          echo "super-secret-e2e-key-123" > e2e-secrets/jwt_key.txt

      - name: Start Application Stack (Compose)
        run: |
          # Use dashes in filename as established in previous steps
          docker compose -f docker-compose-e2e.yaml up -d

          echo "Waiting for stack to stabilize (30s)..."
          sleep 30

          # Show container status for logs
          docker compose -f docker-compose-e2e.yaml ps

      - name: Debug Stack on Failure
        if: failure()
        run: |
          echo "Dumping Container Status..."
          docker compose -f docker-compose-e2e.yaml ps
          echo "Dumping Backend Logs..."
          docker compose -f docker-compose-e2e.yaml logs backend
          echo "Dumping Database Logs..."
          docker compose -f docker-compose-e2e.yaml logs db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop and Cleanup Stack
        if: always()
        run: |
          docker compose -f docker-compose-e2e.yaml down -v
          rm -rf e2e-secrets

  # 3. RELEASE: Fresh Build, Final Scan, and Push
  release:
    name: Final Build & Push
    needs: e2e-validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: dcim-fe:final-scan
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api

      - name: Scan Final Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "dcim-fe:final-scan"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Note: Using DOCKERHUB_TOKEN (corrected typo from DOKERHUB if needed)
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Final Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            pramoneo/dcim-fe:latest
            pramoneo/dcim-fe:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
